<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>农信题库答案查询</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f766e'/%3E%3Cpath d='M4 8.2 6.4 10.6 12 5' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>农信题库答案查询</h1>
      <p class="lead">
        选择已保存的考试页面，再选择小包搜题导出的题库。查询在浏览器里完成。
      </p>
      <form>
        <div class="file">
          <span class="caption">考试页面</span>
          <label class="picker" for="exam-html">
            选择文件
            <input id="exam-html" type="file" accept=".html,.htm,text/html" />
          </label>
          <span id="exam-name" class="hint">未选择文件</span>
        </div>
        <div class="file">
          <span class="caption">题库</span>
          <label class="picker" for="bank-xlsx">
            选择文件
            <input
              id="bank-xlsx"
              type="file"
              accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            />
          </label>
          <span id="bank-name" class="hint">未选择文件</span>
          <span class="hint">小包搜题导入格式，表头为：考题、答案、选项A、选项B、选项C、选项D。</span>
        </div>
        <button id="run" type="button" disabled>开始查询</button>
      </form>
      <p id="status" role="alert"></p>
      <p id="summary" hidden></p>
      <div id="result"></div>
    </main>
    <script src="vendor/fflate.umd.js"></script>
    <script src="match.js"></script>
    <script src="app.js"></script>
  </body>
</html>
